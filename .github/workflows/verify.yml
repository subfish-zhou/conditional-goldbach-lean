name: Verify Lean library

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        working-directory: formalization
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: formalization
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Development verification
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_project.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name != 'pull_request'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: formalization/package-lock.json
      - name: Install release review tools
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python3 -m pip install -r requirements-review.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Complete release verification
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/verify_project.py
          python3 scripts/render_verified.py
          python3 scripts/test_verification.py
          python3 scripts/package_verified.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          path: |
            formalization/verification/current-*.json
            formalization/verification/current-*.log
            formalization/verification/independent-audit/*.log
            formalization/verification/independent-audit/*-phases.jsonl
            formalization/verification/independent-audit/comparator-result.json
            formalization/.lake/development-check-*/
            formalization/verification.json
            formalization/progress*.html
            formalization/progress*-verification.json
            outputs/conditional-goldbach-formalized.zip
            outputs/conditional-goldbach-formalized-verification.json
